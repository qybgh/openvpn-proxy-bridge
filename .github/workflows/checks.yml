name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-privacy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install development tools
        run: brew install ripgrep shellcheck shfmt bats-core
      - name: Run checks
        run: ./tests/check.sh --skip-build
      - name: Build release package
        run: ./scripts/build-release.sh --skip-checks
      - name: Verify release package
        run: |
          archive="dist/openvpn-proxy-bridge-$(cat VERSION).tar.gz"
          (cd dist && shasum -a 256 -c "$(basename "$archive").sha256")
          tar -tzf "$archive" > archive-entries.txt
          grep -q '/setup-company-vpn.command$' archive-entries.txt
          grep -q '/libexec/bin/openvpn-proxy-bridge$' archive-entries.txt
          test -z "$(sort archive-entries.txt | uniq -d)"
          ! grep -E -q '(^|/)(__pycache__/|[^/]+\.pyc$)' archive-entries.txt
      - name: Upload release package
        uses: actions/upload-artifact@v6
        with:
          name: openvpn-proxy-bridge-${{ github.sha }}
          path: dist/*
